services:
  app:
    build: .
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      DATABASE_URL: postgres://quadro:${POSTGRES_PASSWORD:-quadro-local}@db:5432/quadro
      APP_ORIGIN: http://localhost:3001
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quadro
      POSTGRES_USER: quadro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quadro-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quadro -d quadro']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
